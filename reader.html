<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读｜村上春树文学展览</title>
<style>
:root{--ink:#e9e5d9;--muted:#98988f;--paper:#11130f;--panel:#1c2019;--line:#373c31;--acid:#d9e95a;--rust:#c86f4c;--serif:Georgia,'Songti SC','Noto Serif SC',serif;--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}body{background:radial-gradient(circle at 80% 10%,rgba(217,233,90,.07),transparent 30%),var(--paper)}
.reader-shell{min-height:100vh;display:grid;grid-template-rows:72px 1fr}.reader-top{display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line);background:rgba(17,19,15,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:3}.reader-top a,.reader-top button{color:var(--muted);text-decoration:none;font:12px var(--sans);border:0;background:none;cursor:pointer}.reader-top a:hover,.reader-top button:hover{color:var(--acid)}.reader-brand{font:17px var(--serif);color:var(--ink)}.reader-brand small{display:block;color:var(--rust);font:10px var(--sans);letter-spacing:.16em;text-transform:uppercase;margin-bottom:2px}.reader-main{width:min(920px,calc(100% - 40px));margin:0 auto;padding:42px 0 80px}.reader-heading{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:24px}.reader-heading h1{font:clamp(30px,5vw,58px)/1 var(--serif);font-weight:400;margin:0}.reader-heading p{color:var(--muted);font-size:12px;margin:0;text-align:right}.reader-tools{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--panel);padding:12px 16px;margin-bottom:16px;color:var(--muted);font-size:12px}.reader-tools button{border:0;background:none;color:var(--ink);cursor:pointer;padding:8px 12px}.reader-tools button:hover{color:var(--acid)}.reader-page{min-height:620px;background:#f1eee5;color:#24231e;padding:54px clamp(28px,7vw,92px);font:18px/1.95 Georgia,'Songti SC','Noto Serif SC',serif;box-shadow:0 18px 60px rgba(0,0,0,.22);overflow:auto}.reader-page h1,.reader-page h2,.reader-page h3{font-weight:400;line-height:1.3}.reader-page p{margin:0 0 1em}.reader-page img{max-width:100%;height:auto}.reader-page a{color:#8a4d39;text-decoration:underline;text-underline-offset:3px}.reader-status{color:var(--muted);font-size:12px;margin:14px 0}.reader-error{padding:28px;border:1px solid var(--rust);color:#e5a68c}.reader-error a{color:var(--acid)}@media(max-width:700px){.reader-shell{grid-template-rows:62px}.reader-main{width:calc(100% - 24px);padding-top:26px}.reader-heading{display:block}.reader-heading p{text-align:left;margin-top:12px}.reader-page{min-height:calc(100vh - 190px);padding:34px 22px;font-size:17px}.reader-tools{padding:8px}.reader-brand{font-size:15px}}
</style>
</head>
<body>
<div class="reader-shell">
<header class="reader-top"><a href="index.html">← 返回展览</a><div class="reader-brand"><small>Reading room</small><span id="bookTopTitle">正在打开</span></div><a id="downloadBook" href="#" download>下载 EPUB ↓</a></header>
<main class="reader-main"><div class="reader-heading"><h1 id="bookTitle">正在打开</h1><p id="bookMeta">章节阅读器</p></div><div class="reader-tools"><button id="prevPage">← 上一章</button><span id="chapterStatus">正在读取…</span><button id="nextPage">下一章 →</button></div><div id="readerStatus" class="reader-status"></div><article id="readerPage" class="reader-page"></article></main>
</div>
<script>
const params=new URLSearchParams(location.search);const epubPath=params.get('book');const title=params.get('title')||decodeURIComponent((epubPath||'').split('/').pop()||'阅读');const titleNode=document.querySelector('#bookTitle'),topTitle=document.querySelector('#bookTopTitle'),meta=document.querySelector('#bookMeta'),status=document.querySelector('#readerStatus'),page=document.querySelector('#readerPage'),chapterStatus=document.querySelector('#chapterStatus'),download=document.querySelector('#downloadBook');let chapters=[],chapterIndex=0;
titleNode.textContent=title;topTitle.textContent=title;meta.textContent='静态章节阅读器';if(epubPath)download.href=encodeURI(epubPath);
function showChapter(){if(!chapters.length)return;page.innerHTML=chapters[chapterIndex].html;chapterStatus.textContent='第 '+(chapterIndex+1)+' / '+chapters.length+' 章';status.textContent='可用上方按钮或键盘 ← → 翻页';page.scrollTop=0}
function move(step){if(!chapters.length)return;chapterIndex=Math.max(0,Math.min(chapters.length-1,chapterIndex+step));showChapter()}
page.addEventListener('click',event=>{const link=event.target.closest('a[href^="#reader-chapter-"]');if(!link)return;event.preventDefault();const target=Number(link.getAttribute('href').replace('#reader-chapter-',''));const index=chapters.findIndex(chapter=>chapter.number===target);if(index>=0){chapterIndex=index;showChapter()}});
document.querySelector('#prevPage').addEventListener('click',()=>move(-1));document.querySelector('#nextPage').addEventListener('click',()=>move(1));document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft')move(-1);if(event.key==='ArrowRight')move(1)});
async function load(){if(!epubPath){status.innerHTML='<div class="reader-error">没有指定书籍。<a href="index.html">返回展览</a></div>';return}const file=decodeURIComponent(epubPath.split('/').pop());const jsonName=file.replace(/\.epub$/i,'.json');try{status.textContent='正在读取章节数据…';const response=await fetch('reader-data/'+encodeURIComponent(jsonName));if(!response.ok)throw new Error(response.status);const data=await response.json();chapters=data.chapters||[];if(!chapters.length)throw new Error('empty');showChapter()}catch(error){console.error(error);status.innerHTML='<div class="reader-error">章节数据加载失败。请刷新页面，或返回展览使用下载按钮。<br><a href="'+encodeURI(epubPath)+'" download>下载原始 EPUB</a></div>'}}
load();
</script>
</body>
</html>
